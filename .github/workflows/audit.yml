name: audit

# The audit runs install scripts from other people's repositories. That is what
# it is for, and it is exactly why it runs here and not on a laptop.
on:
  workflow_dispatch:
    inputs:
      list:
        description: repository list to audit
        required: false
        default: repos.txt

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      # One repository failing to install must not cancel the other shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Docker is present
        run: docker version

      - name: audit shard ${{ matrix.shard }}
        # `|| true` because a broken README is data, not a build failure.
        run: |
          node dist/src/main.js audit "${{ inputs.list }}" \
            --shard "${{ matrix.shard }}/4" \
            --out "results/shard-${{ matrix.shard }}" \
            --keep-going \
            --timeout 3m || true

      - name: totals for this shard
        if: always()
        run: |
          node -e "
            const summary = require('./results/shard-${{ matrix.shard }}/summary.json');
            console.table(summary.totals);
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}
          retention-days: 30
