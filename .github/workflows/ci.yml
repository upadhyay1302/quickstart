name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

      # The tool should work on a repository that is not this one.
      - name: check the example project
        run: |
          node dist/src/main.js check examples/broken-app --local --json > report.json || true
          node -e "const r = require('./report.json'); if (r.summary.failed !== 1) process.exit(1)"
